<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">
    <title>PIYNO GALERISI</title>
    <style>
        /* EDIT THE THEME COLOR HERE */
        :root {
            --bg-color: #e0f2fe; /* Light blue hex code */
            --text-color: #0f172a;
            --card-color: #ffffff;
            --accent-color: #0284c7;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-color);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--accent-color);
            margin-top: 0;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>bu website bu asagidaki medyalari insanlara gostermek icin var baska amaci yok</h2>

        
    </div>

</body>
</html>
